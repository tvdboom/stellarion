name: Build, test, package, and deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "12"

jobs:
  quality:
    name: Format, lint, test, and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev
          libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -j12 -- -D warnings
      - name: Install KTX-Software
        run: |
          curl --fail --location --retry 3 \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb \
            --output "$RUNNER_TEMP/ktx-software.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx-software.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/ktx-software.deb"
      # Runtime assets are ignored build outputs and must exist before texture tests.
      - name: Generate runtime assets
        run: cargo run --features asset-pipeline --bin build-assets -j12 -- --jobs 12
      - name: Run tests
        run: cargo test --all-targets --all-features -j12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify disposable SQL database
        run: |
          npm install --prefix target/sql-verification --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.8
          node tests/sql/verify-schema.mjs
      - name: Verify generated runtime assets
        run: cargo run --features asset-pipeline --bin build-assets -j12 -- --check --jobs 12
      - name: Share verified runtime assets with packaging jobs
        uses: actions/upload-artifact@v7
        with:
          name: runtime-assets
          path: assets-runtime/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error

  wasm:
    name: WebAssembly
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-assets
          path: assets-runtime/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(tr -d '[:space:]' < scripts/wasm-bindgen-version.txt)"
          cargo install wasm-bindgen-cli --version "$version" --locked -j12
      - name: Build and package HTML5 bundle
        run: bash scripts/package-web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-html
          path: dist/stellarion-html.zip
          compression-level: 0
          if-no-files-found: error

  native:
    name: Native ${{ matrix.channel }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            channel: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            channel: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-assets
          path: assets-runtime/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev
          libxcursor-dev libxrandr-dev libxkbcommon-dev zip
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native.ps1 -Target '${{ matrix.target }}' -Channel '${{ matrix.channel }}'
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          CHANNEL: ${{ matrix.channel }}
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-${{ matrix.channel }}
          path: dist/stellarion-${{ matrix.channel }}.zip
          compression-level: 0
          if-no-files-found: error

  macos:
    name: Native macOS universal
    needs: quality
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-assets
          path: assets-runtime/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both macOS architectures
        run: |
          cargo build --release --target aarch64-apple-darwin --bin stellarion -j12
          cargo build --release --target x86_64-apple-darwin --bin stellarion -j12
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/stellarion \
            target/x86_64-apple-darwin/release/stellarion \
            -output dist/stellarion-universal
          chmod +x dist/stellarion-universal
      - name: Package universal binary
        env:
          TARGET: aarch64-apple-darwin
          CHANNEL: mac
          BINARY_PATH: ${{ github.workspace }}/dist/stellarion-universal
          SKIP_BUILD: "1"
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-mac
          path: dist/stellarion-mac.zip
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/master'
    needs: [quality, wasm, native, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stellarion-*
          path: release
          merge-multiple: true
      - name: Create release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "build-$GITHUB_RUN_NUMBER" >/dev/null 2>&1; then
            gh release upload "build-$GITHUB_RUN_NUMBER" release/*.zip --clobber
          else
            gh release create "build-$GITHUB_RUN_NUMBER" release/*.zip \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "Stellarion build $GITHUB_RUN_NUMBER"
          fi

  itch:
    name: itch.io deployment
    if: github.ref == 'refs/heads/master'
    needs: [quality, wasm, native, macos]
    runs-on: ubuntu-latest
    env:
      BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
      ITCH_USER: tvdboom
      ITCH_GAME: stellarion
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stellarion-*
          path: deploy
          merge-multiple: true
      - name: Deploy HTML5 channel
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          CHANNEL: html
          PACKAGE: deploy/stellarion-html.zip
      - name: Deploy Windows channel
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          CHANNEL: windows
          PACKAGE: deploy/stellarion-windows.zip
      - name: Deploy Linux channel
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          CHANNEL: linux
          PACKAGE: deploy/stellarion-linux.zip
      - name: Deploy macOS channel
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          CHANNEL: mac
          PACKAGE: deploy/stellarion-mac.zip
