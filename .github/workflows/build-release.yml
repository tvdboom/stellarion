name: Build, test, package, and deploy

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "12"

jobs:
  quality:
    name: Format, lint, test, and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev
          libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -j12 -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features -j12
      - name: Verify generated runtime assets
        run: cargo run --features asset-pipeline --bin build-assets -j12 -- --check --jobs 12

  wasm:
    name: WebAssembly / itch.io HTML5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(tr -d '[:space:]' < scripts/wasm-bindgen-version.txt)"
          cargo install wasm-bindgen-cli --version "$version" --locked -j12
      - name: Build and package HTML5 bundle
        run: bash scripts/package-web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-html
          path: dist/stellarion-html.zip
          compression-level: 0
          if-no-files-found: error

  native:
    name: Native ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            channel: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            channel: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev
          libxcursor-dev libxrandr-dev libxkbcommon-dev zip
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-native.ps1 -Target '${{ matrix.target }}' -Channel '${{ matrix.channel }}'
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          CHANNEL: ${{ matrix.channel }}
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-${{ matrix.channel }}
          path: dist/stellarion-${{ matrix.channel }}.zip
          compression-level: 0
          if-no-files-found: error

  macos:
    name: Native macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both macOS architectures
        run: |
          cargo build --release --target aarch64-apple-darwin --bin stellarion -j12
          cargo build --release --target x86_64-apple-darwin --bin stellarion -j12
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/stellarion \
            target/x86_64-apple-darwin/release/stellarion \
            -output dist/stellarion-universal
          chmod +x dist/stellarion-universal
      - name: Package universal binary
        env:
          TARGET: aarch64-apple-darwin
          CHANNEL: mac
          BINARY_PATH: ${{ github.workspace }}/dist/stellarion-universal
          SKIP_BUILD: "1"
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stellarion-mac
          path: dist/stellarion-mac.zip
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, wasm, native, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stellarion-*
          path: release
          merge-multiple: true
      - name: Create release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --verify-tag

  itch:
    name: Optional itch.io Butler deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [quality, wasm, native, macos]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stellarion-*
          path: deploy
          merge-multiple: true
      - name: Push configured channels
        if: env.BUTLER_API_KEY != '' && env.ITCH_USER != '' && env.ITCH_GAME != ''
        run: |
          curl --fail --location --retry 3 \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default \
            --output butler.zip
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          version="${GITHUB_SHA::12}"
          butler/butler push deploy/stellarion-html.zip "$ITCH_USER/$ITCH_GAME:html" --userversion "$version"
          butler/butler push deploy/stellarion-windows.zip "$ITCH_USER/$ITCH_GAME:windows" --userversion "$version"
          butler/butler push deploy/stellarion-linux.zip "$ITCH_USER/$ITCH_GAME:linux" --userversion "$version"
          butler/butler push deploy/stellarion-mac.zip "$ITCH_USER/$ITCH_GAME:mac" --userversion "$version"
      - name: Explain skipped deployment
        if: env.BUTLER_API_KEY == '' || env.ITCH_USER == '' || env.ITCH_GAME == ''
        run: echo "Packages built successfully; Butler variables/credentials are not configured."
