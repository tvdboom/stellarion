<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c1014">
    <title>Stellarion</title>
    <style>
      :root { color-scheme: dark; background: #0c1014; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { position: relative; font-family: system-ui, sans-serif; }
      #bevy {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #d9e7ff;
        font-size: 40px;
        font-weight: 700;
        text-align: center;
        pointer-events: none;
      }
      #status::before {
        content: "";
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status.error { padding: 1rem; color: #ffb4a9; font-size: 16px; pointer-events: auto; }
      #status.error::before { display: none; }
    </style>
  </head>
  <body>
    <canvas id="bevy" aria-label="Stellarion game canvas"></canvas>
    <p id="status" role="status">Loading</p>
    <script type="module">
      import init from "./stellarion.js";

      const status = document.querySelector("#status");
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = "Stellarion could not start. Reload the page or check the browser console.";
        status.classList.add("error");
      }
    </script>
  </body>
</html>
