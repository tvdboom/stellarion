<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c1014">
    <link rel="icon" type="image/png" href="./assets-runtime/images/icons/planet.png">
    <title>Stellarion</title>
    <style>
      :root { color-scheme: dark; background: #0c1014; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body { position: relative; font-family: system-ui, sans-serif; }
      #bevy {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: #050b14;
        color: #d9e7ff;
        text-align: center;
        pointer-events: none;
      }
      .loading-background { position: absolute; inset: 0; background: center / cover no-repeat url("./assets-runtime/images/bg/menu.png"); }
      .loading-content { position: relative; width: min(560px, calc(100% - 40px)); margin-bottom: clamp(42px, 7.9vh, 78px); }
      .loading-detail { margin: 0 0 12px; color: #edf5ff; font-size: clamp(13px, 1.5vw, 23px); }
      .loading-percentage { margin: 0; color: #b1cfe2; font: clamp(10px, 1.17vw, 18px) monospace; }
      #status.error .loading-detail { color: #ffb4a9; }
    </style>
  </head>
  <body>
    <canvas id="bevy" aria-label="Stellarion game canvas"></canvas>
    <div id="status" role="status" aria-live="polite">
      <div class="loading-background" aria-hidden="true"></div>
      <div class="loading-content">
        <p class="loading-detail">Loading game</p>
        <p class="loading-percentage">0%</p>
      </div>
    </div>
    <script type="module">
      import init from "./stellarion.js";

      // Clipboard.writeText can be denied inside an embedded game even after a click. Handle the
      // synchronous copy event first, and retain the modern API as a browser-level fallback.
      let copyCandidate = null;
      window.stellarionSetCopyCandidate = (text) => { copyCandidate = String(text); };
      window.stellarionClearCopyCandidate = () => { copyCandidate = null; };
      document.addEventListener("copy", (event) => {
        if (copyCandidate === null || !event.clipboardData) return;
        event.clipboardData.setData("text/plain", copyCandidate);
        event.preventDefault();
      });
      window.stellarionCopyText = (text) => {
        const value = String(text);
        const previousCandidate = copyCandidate;
        const previousFocus = document.activeElement;
        const source = document.createElement("textarea");
        source.value = value;
        source.readOnly = true;
        source.setAttribute("aria-hidden", "true");
        source.style.cssText = "position:fixed;left:-10000px;top:0;opacity:0;pointer-events:none";
        document.body.append(source);
        copyCandidate = value;

        let copied = false;
        try {
          source.focus({ preventScroll: true });
          source.select();
          copied = document.execCommand("copy");
        } catch (error) {
          console.debug("Synchronous clipboard fallback was unavailable", error);
        } finally {
          source.remove();
          copyCandidate = previousCandidate;
          previousFocus?.focus?.({ preventScroll: true });
        }
        if (copied) return true;

        try {
          if (window.isSecureContext && navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(value).catch((error) => {
              console.warn("Clipboard write was rejected", error);
            });
            return true;
          }
        } catch (error) {
          console.warn("Clipboard write was unavailable", error);
        }
        return false;
      };

      // A canvas has no native editable context menu. The in-game Paste action starts the
      // permission-gated read synchronously from its click, then Rust consumes it next frame.
      let pendingPaste;
      window.stellarionRequestPaste = () => {
        pendingPaste = null;
        try {
          if (window.isSecureContext && navigator.clipboard?.readText) {
            navigator.clipboard.readText().then(
              (text) => { pendingPaste = String(text); },
              (error) => {
                console.warn("Clipboard read was rejected", error);
                pendingPaste = false;
              },
            );
            return true;
          }
        } catch (error) {
          console.warn("Clipboard read was unavailable", error);
        }
        pendingPaste = false;
        return false;
      };
      window.stellarionTakePaste = () => {
        const result = pendingPaste;
        if (typeof result === "string" || result === false) pendingPaste = undefined;
        return result;
      };

      const status = document.querySelector("#status");
      // The game handles wheel input itself (egui scrolling and map zoom). Prevent the
      // browser/itch.io container from interpreting the same gesture as page scrolling.
      document.addEventListener("wheel", (event) => event.preventDefault(), { passive: false });
      // Right-click is also game input; keep the browser context menu from covering the canvas.
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.querySelector(".loading-detail").textContent = "Stellarion could not start. Reload the page or check the browser console.";
        status.querySelector(".loading-percentage").hidden = true;
        status.classList.add("error");
      }
    </script>
  </body>
</html>
