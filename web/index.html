<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c1014">
    <title>Stellarion</title>
    <style>
      :root { color-scheme: dark; background: #0c1014; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { position: relative; font-family: system-ui, sans-serif; }
      #bevy {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: auto 1rem 1rem;
        margin: 0;
        color: #d9e7ff;
        text-align: center;
        pointer-events: none;
      }
      #status.error { color: #ffb4a9; pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="bevy" aria-label="Stellarion game canvas"></canvas>
    <p id="status" role="status">Loading Stellarion…</p>
    <script type="module">
      import init from "./stellarion.js";

      const status = document.querySelector("#status");
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = "Stellarion could not start. Reload the page or check the browser console.";
        status.classList.add("error");
      }
    </script>
  </body>
</html>
