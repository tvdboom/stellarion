[package]
name = "stellarion"
version = "0.1.0"
edition = "2021"
authors = ["Mavs"]
description = "A deterministic multiplayer space strategy game for native and WebAssembly"

[[bin]]
name = "build-assets"
path = "src/bin/build_assets.rs"
required-features = ["asset-pipeline"]

[features]
default = ["app"]
app = []
asset-pipeline = []

[dependencies]
base64 = "0.23.1"
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_picking",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "serialize",
    "sprite_picking",
    "ui_picking",
    "webgl2",
]}
basisu = "0.1.0"
bevy_egui = { version = "0.42.0", default-features = false, features = [
    "bevy_ui",
    "default_fonts",
    "picking",
    "render",
] }
bevy_kira_audio = "0.26.0"
bevy_tweening = "0.16.0"
ewebsock = { version = "0.8.0", features = ["tls"] }
futures-lite = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
itertools = "0.15.0"
rand = "0.10.2"
rand_chacha = { version = "0.10.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
strum = "0.28.0"
strum_macros = "0.28.0"
subtle = "2.6.1"
thiserror = "2.0.20"
voronator = "0.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "multi_threaded",
    "x11",
] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1.53.1", default-features = false, features = [
    "net",
    "rt-multi-thread",
    "time",
] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.104"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "Location",
    "Storage",
    "Window",
] }

[dev-dependencies]
proptest = "1.11.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
